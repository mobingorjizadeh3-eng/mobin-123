<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ragdoll Combat 3D | Loading...</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; background:#0b0f17; color:#f8fafc; font-family: system-ui, sans-serif; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
    .spinner { width:48px; height:48px; border:4px solid #1e293b; border-top-color:#ef4444; border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size:14px; opacity:0.8; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p id="status">در حال بارگذاری نسخه کامل بازی...</p>
  <script>
    (async function() {
      const status = document.getElementById('status');
      try {
        // Load the last known good full version from git history
        const url = 'https://raw.githubusercontent.com/mobingorjizadeh3-eng/mobin-123/8c7721680d926e19f0b8f3eb630583d9cfdfb652/index.html';
        status.textContent = 'در حال دریافت کد کامل...';
        const res = await fetch(url + '?t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const html = await res.text();
        if (html.length < 50000) throw new Error('فایل ناقص دریافت شد');
        status.textContent = 'در حال راه‌اندازی بازی...';
        // Replace entire document with the full game
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        status.innerHTML = 'خطا در بارگذاری: ' + err.message + '<br><br>لطفاً به گراک بگو «نسخه اصلی رو از تاریخچه برگردون»';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
